[package]
name = "x11-bridge-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dev-dependencies]
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
